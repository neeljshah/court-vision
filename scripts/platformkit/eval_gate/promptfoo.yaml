# scripts/platformkit/eval_gate/promptfoo.yaml
#
# CI wrapper for the Brier-Skill-Score eval gate (roadmap N1).
#
# WHAT THIS DOES: wraps "python -m scripts.platformkit.eval_gate.run_gate --golden"
# as a promptfoo assertion with IDENTICAL exit semantics to the bare CLI.
# The LLM never emits a probability here -- promptfoo only drives the numeric
# Python gate as a CI assertion; no model_graded / judge step is involved.
#
# HOW TO INSTALL promptfoo (if not present): npm install -g promptfoo
# HOW TO INVOKE (from repo root):
#   promptfoo eval -c scripts/platformkit/eval_gate/promptfoo.yaml
#
# HONEST CONTRACT:
#   - The offline golden fixture is a SYNTHETIC reproducibility/regression ANCHOR
#     (see tests/fixtures/golden/SCHEMA.md). It is NOT a real calibration claim.
#   - BSS <= 0 / MATCHES_CLOSE is an HONEST SUCCESS, never a failure.
#   - The gate BLOCKS only on regression-vs-frozen-baseline or a leak-guard
#     assertion. It NEVER blocks on "fails to beat the close".
#   - NEVER retract / reprint: +18.38% / 0.119 / +54% / 78.11 / 8.94 / 54.57.
#
# Same 0/1 exit contract as the bare CLI. No network, no data/, no flag flips.
# Wiring into .claude/settings.json PreToolUse/CI is DEFERRED to roadmap N4
# (human-confirm required); do not apply that wiring here.

description: >-
  Brier-Skill-Score CI gate (calibration vs devigged close; SYNTHETIC golden
  anchor; local-only). Blocks on REGRESSION-vs-frozen-baseline or LEAK only,
  never on 'fails to beat the close'. BSS<=0 / MATCHES_CLOSE = honest success.

providers:
  # exec provider: command is embedded in the id string after "exec: ".
  # promptfoo spawns the process from the repo root; exit 0 = pass, exit 1 = fail.
  # The gate is offline: no network, no data/ reads.
  - id: "exec: C:/Users/neelj/anaconda3/envs/basketball_ai/python.exe -m scripts.platformkit.eval_gate.run_gate --golden"

prompts:
  - "run"

tests:
  - assert:
      # Presence guards on stdout: the scoreboard must contain these strings.
      # "verdict" confirms a per-corpus scoreboard line was printed.
      # "SYNTHETIC ANCHOR" guards the honesty banner stays in the output
      #   (ensures the golden fixture is correctly labelled as a synthetic
      #   reproducibility anchor, not a real calibration claim).
      # Pass/fail from the process exit code is handled natively by promptfoo:
      #   exit 0 -> test passes, exit 1 -> test fails (regression or leak fired).
      - type: contains
        value: "verdict"
      - type: contains
        value: "SYNTHETIC ANCHOR"

defaultTest:
  options:
    # Run gate iterations serially: the gate owns walk-forward state and
    # must not be parallelised across test rows (one row here; guard for future).
    runSerially: true
