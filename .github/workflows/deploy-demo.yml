# Static recruiter demo -- builds the webapp in NEXT_PUBLIC_DATA_MODE=snapshot
# (baked /demo-data/*.json, no backend) and deploys the `out/` export to GitHub
# Pages as a project site (neeljshah/court-vision -> /court-vision/).
#
# The snapshot JSON itself is NOT regenerated here (the exporter needs the live
# P5/boards services, which don't run in CI) -- it is committed ahead of time by
# scripts/platformkit/publish_demo/refresh_and_stage.py, run locally against the
# running stack. This workflow only rebuilds + redeploys the static site from
# whatever webapp/public/demo-data/*.json is currently checked in.
name: Deploy demo

on:
  push:
    branches: [master]
    paths:
      - "webapp/**"
      - ".github/workflows/deploy-demo.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: webapp
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: webapp/package-lock.json

      - name: Install deps
        run: npm ci

      - name: Analytics unit tests (one file per process)
        run: |
          npx vitest run lib/analytics/dashboardData.test.ts
          npx vitest run lib/analytics/labData.test.ts
          npx vitest run lib/analytics/labTypes.test.ts
          npx vitest run lib/analytics/distribution.test.ts
          npx vitest run lib/analytics/comparisonData.test.ts
          npx vitest run lib/analytics/tennisSurfaceComparison.test.ts
          npx vitest run lib/analytics/tennisSurfaceIntegration.test.ts
          npx vitest run lib/analytics/soccerVenueComparison.test.ts
          npx vitest run lib/analytics/pitchCountComparison.test.ts
          npx vitest run lib/analytics/pitchResultComparison.test.ts
          npx vitest run lib/analytics/mlbAtlasFamily.test.ts
          npx vitest run lib/analytics/researchBasketball.test.ts
          npx vitest run lib/analytics/researchMultisport.test.ts
          npx vitest run lib/analytics/researchValidation.test.ts
          npx vitest run lib/analytics/researchBasketballDepth.test.ts
          npx vitest run lib/analytics/researchMultisportDepth.test.ts
          npx vitest run lib/analytics/researchTennisWindows.test.ts
          npx vitest run lib/analytics/researchBasketballMatchupRange.test.ts
          npx vitest run lib/analytics/researchMlbBatterContact.test.ts
          npx vitest run lib/analytics/researchIntegration.test.ts
          npx vitest run lib/analytics/libraryData.test.ts
          npx vitest run lib/analytics/matchupInsights.test.ts
          npx vitest run lib/analytics/askSearch.test.ts
          npx vitest run lib/analytics/scoutCorpus.test.ts
          npx vitest run components/analytics/AskBox.test.tsx
          npx vitest run components/analytics/compare/CompareExperience.test.tsx
          npx vitest run components/analytics/compare/MlbAtlasCompareExperience.test.tsx
          npx vitest run components/analytics/compare/TennisSurfaceComparison.test.tsx
          npx vitest run components/analytics/compare/SoccerVenueComparison.test.tsx
          npx vitest run components/analytics/compare/SoccerCompareExperience.test.tsx
          npx vitest run components/analytics/compare/PitchCountComparison.test.tsx
          npx vitest run components/analytics/compare/PitchResultComparison.test.tsx
          npx vitest run components/analytics/library/LibraryExplorer.test.tsx
          npx vitest run components/analytics/library/ResearchDetail.test.tsx
          npx vitest run components/analytics/library/useResearchView.test.tsx
          npx vitest run components/analytics/library/MlbBatterContact.test.tsx
          npx vitest run components/analytics/library/TennisWindowResearch.test.tsx
          npx vitest run components/analytics/library/BasketballMatchupRange.test.tsx
          npx vitest run components/analytics/lab/MeasurementLab.test.tsx
          npx vitest run components/analytics/lab/LabPlot.test.tsx
          npx vitest run components/analytics/lab/DistributionSummary.test.tsx
          npx vitest run components/analytics/lab/LabTable.test.ts
          npx vitest run components/analytics/evidence/EvidenceGallery.test.tsx
          npx vitest run components/analytics/CommandPalette.test.tsx
          npx vitest run components/analytics/AnalyticsNavigation.test.tsx
          npx vitest run components/analytics/workspace/Workspace.test.tsx

      - name: Static export (snapshot data mode)
        env:
          NEXT_PUBLIC_DATA_MODE: snapshot
          NEXT_PUBLIC_BASE_PATH: /court-vision
        run: npm run build

      - name: Verify analytics export (hard gate)
        env:
          NEXT_PUBLIC_BASE_PATH: /court-vision
        run: |
          node scripts/verify-analytics-export.mjs
          node --test scripts/verify-analytics-export.test.mjs

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: webapp/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
