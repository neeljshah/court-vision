# Static recruiter demo -- builds the webapp in NEXT_PUBLIC_DATA_MODE=snapshot
# (baked /demo-data/*.json, no backend) and deploys the `out/` export to GitHub
# Pages as a project site (neeljshah/court-vision -> /court-vision/).
#
# The snapshot JSON itself is NOT regenerated here (the exporter needs the live
# P5/boards services, which don't run in CI) -- it is committed ahead of time by
# scripts/platformkit/publish_demo/refresh_and_stage.py, run locally against the
# running stack. This workflow only rebuilds + redeploys the static site from
# whatever webapp/public/demo-data/*.json is currently checked in.
name: Deploy demo

on:
  push:
    branches: [master, main]
    paths:
      - "webapp/**"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: webapp
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: webapp/package-lock.json

      - name: Install deps
        run: npm ci

      - name: Static export (snapshot data mode)
        env:
          NEXT_PUBLIC_DATA_MODE: snapshot
          NEXT_PUBLIC_BASE_PATH: /court-vision
        run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: webapp/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
