          npx vitest run components/analytics/lab/RimProfileContext.test.tsx
          npx vitest run components/analytics/lab/MeasurementLabIntegrity.test.tsx
          npx vitest run components/analytics/lab/LabPlot.test.tsx
          npx vitest run components/analytics/lab/ScatterSummary.test.tsx
          npx vitest run components/analytics/lab/DistributionSummary.test.tsx
          npx vitest run components/analytics/lab/MeasurementPosition.test.tsx
          npx vitest run components/analytics/lab/LabComparisonContext.test.tsx
          npx vitest run components/analytics/pitch-sequencing/PitchSequencing.test.tsx
          npx vitest run components/analytics/residual-anatomy/ResidualAnatomy.test.tsx
          npx vitest run components/analytics/blowout-timing/BlowoutTiming.test.tsx
          npx vitest run components/analytics/lab/LabTable.test.ts
          npx vitest run components/analytics/lab/TablePagination.test.tsx
          npx vitest run components/analytics/evidence/EvidenceGallery.test.tsx
          npx vitest run components/analytics/CommandPalette.test.tsx
          npx vitest run components/analytics/AnalyticsNavigation.test.tsx
          npx vitest run components/analytics/workspace/Workspace.test.tsx
          npx vitest run components/analytics/workspace/Research.test.tsx

      - name: Verify published JSON
        run: |
          node scripts/verify-public-json.mjs
          node --test scripts/verify-public-json.test.mjs

      - name: Verify paper evidence references
        run: |
          node scripts/check-paper-evidence.mjs
          node --test scripts/check-paper-evidence.test.mjs

      - name: Static export (snapshot data mode)
        env:
          NEXT_PUBLIC_DATA_MODE: snapshot
          NEXT_PUBLIC_BASE_PATH: /court-vision
        run: npm run build

      - name: Verify analytics export (hard gate)
        env:
          NEXT_PUBLIC_BASE_PATH: /court-vision
        run: |
          node scripts/check-client-imports.mjs
          node scripts/check-paper-evidence.mjs
          node scripts/check-analytics-copy.mjs --data
          node scripts/verify-analytics-export.mjs
          node --test scripts/verify-analytics-export.test.mjs
          node scripts/verify-public-json.mjs out/data

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: webapp/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
