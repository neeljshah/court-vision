name: CI

on:
  push:
    branches: [master, main, "docs/**", "feat/**", "fix/**"]
  pull_request:
    branches: [master, main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt || pip install -e ".[dev]" || true

      - name: Lint (ruff)
        run: |
          pip install ruff
          ruff check src/ api/ tests/ --ignore E501 || true

      - name: Test with coverage (pytest-cov)
        run: |
          pip install pytest pytest-cov
          python -m pytest tests/ -q --ignore=tests/cv --ignore=tests/gpu -x \
            --cov=src --cov=scripts \
            --cov-report=term-missing \
            --cov-fail-under=30

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: .coverage

  cv-quality:
    runs-on: ubuntu-latest
    continue-on-error: true  # non-blocking — CV tests may need GPU/data
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt || pip install -e ".[dev]" || true

      - name: Run CV quality tests (non-blocking)
        run: |
          pip install pytest
          python -m pytest tests/cv/ -v --tb=short || true
