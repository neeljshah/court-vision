name: CI

on:
  push:
    branches: [master, main, "docs/**", "feat/**", "fix/**"]
  pull_request:
    branches: [master, main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt || pip install -e ".[dev]" || true

      - name: Lint (ruff)
        run: |
          pip install ruff
          ruff check src/ api/ tests/ --ignore E501 || true

      - name: Test (pytest)
        run: |
          pip install pytest
          python -m pytest tests/ -q --ignore=tests/cv --ignore=tests/gpu -x
