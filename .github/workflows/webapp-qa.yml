# webapp QA gate -- the honesty + regression guard for the analytics site.
#
# This does NOT block the Deploy demo workflow (it runs independently on the same
# push); it is the signal that a change broke a hard invariant. The hard gates are
# the ones a human has been checking by hand on every ship:
#   * typecheck               -- the build's type contract
#   * the honesty grep        -- the crown jewel: fails if a RETRACTED figure
#                                (+18.38 / 78.11 / 54.57 / 8.94 / +54%) appears in
#                                shipped HTML OUTSIDE the pages that frame it as a
#                                retraction. 0.119 is deliberately NOT grepped: it
#                                collides with legitimate descriptive stats (tennis
#                                rates), so a numeric grep cannot tell the retracted
#                                endQ3 value from an honest one.
#   * page-count tripwire      -- guards against a template refactor silently
#                                deleting thousands of exported pages.
#   * performance budget      -- fails when a listed page's gzip JS / CSS / HTML
#                                exceeds webapp/perf/budget.json, or an image under
#                                public/img/showcase or public/brand exceeds its cap
#                                (ceilings = the 2026-10-20 after-measurement + ~10%).
#   * accessibility gate      -- axe-core on the same pages in both themes; any
#                                serious/critical violation fails (moderate/minor warn).
#     (both steps are commented out below until the ceilings are re-measured on
#      the restructured shell; the 2026-10-20 numbers predate it)
# lint and test are reported but non-blocking: the repo carries known pre-existing
# lint warnings and ~16 terminal-app test failures unrelated to the analytics site;
# making them hard gates would fail red on day one and train everyone to ignore it.
name: webapp QA

on:
  push:
    branches: [master, main]
    paths:
      - "webapp/**"
  pull_request:
    paths:
      - "webapp/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: webapp
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: webapp/package-lock.json

      - name: Install deps
        run: npm ci

      - name: Typecheck (hard gate)
        run: npm run typecheck

      - name: Lint (report-only)
        run: npm run lint || echo "::warning::lint reported issues (non-blocking)"

      - name: Unit tests (report-only)
        run: npm run test || echo "::warning::vitest reported failures (non-blocking; known pre-existing)"

      - name: Static export (snapshot data mode)
        env:
          NEXT_PUBLIC_DATA_MODE: snapshot
          NEXT_PUBLIC_BASE_PATH: /court-vision
        run: npm run build

      - name: Honesty gate -- no retracted figures outside retraction framing (hard gate)
        run: |
          # Legit retraction / limitations surfaces where these numbers MUST appear,
          # struck through and labelled. Anywhere else is a regression.
          ALLOW='findings/retraction|evidence/retraction-story|evidence/retractions|methodology/'
          # Each retracted figure is bounded by non-digits so 8.94 does not match
          # 18.945 etc; +54% is matched literally.
          HITS=$(grep -rElE '([^0-9])(18\.38|78\.11|54\.57|8\.94)([^0-9])|\+54%' out --include='*.html' \
                 | grep -vE "$ALLOW" || true)
          if [ -n "$HITS" ]; then
            echo "::error::Honesty gate FAILED -- a retracted figure appears outside retraction framing:"
            echo "$HITS"
            exit 1
          fi
          echo "Honesty gate GREEN: no retracted figures leaked into shipped HTML."

      # Non-blocking measurement for re-setting the budgets (see webapp/perf/README.md, "Re-measuring").
      - name: Performance report (non-blocking)
        continue-on-error: true
        run: |
          mkdir -p report
          node scripts/perf-budget.mjs out perf/budget.json --report | tee report/perf-report.md
          awk '/^```json/{f=1;next} /^```/{f=0} f' report/perf-report.md > report/perf-report.json
          cat report/perf-report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload perf-report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perf-report
          path: webapp/report/perf-report.*
          retention-days: 7
          if-no-files-found: ignore

      # Head-tag audit per page family (title, description < 160 and unique, canonical, og, twitter, stub
      # noindex, JSON-LD). Report only -- see webapp/scripts/meta-audit.mjs; no hard gate yet.
      - name: Metadata audit (non-blocking report)
        continue-on-error: true
        run: |
          mkdir -p report
          node --test scripts/meta-audit.test.mjs
          node scripts/meta-audit.mjs out --report --verbose | tee report/meta-audit.md
          awk '/^```json/{f=1;next} /^```/{f=0} f' report/meta-audit.md > report/meta-audit.json
          cat report/meta-audit.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload meta-audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: meta-audit
          path: webapp/report/meta-audit.*
          retention-days: 7
          if-no-files-found: ignore

      - name: Accessibility report (non-blocking; skipped when Chrome is absent)
        continue-on-error: true
        run: |
          mkdir -p report
          # Same Chrome logic as the gate: A11Y_CHROME if set, else the runner's Google Chrome (channel "chrome").
          if [ -z "$A11Y_CHROME" ] && ! command -v google-chrome >/dev/null 2>&1; then
            echo "a11y report skipped: no Chrome found and A11Y_CHROME is unset" | tee report/a11y-report.md
          else
            node scripts/a11y-gate.mjs out perf/a11y-pages.json --report | tee report/a11y-report.md
            awk '/^```json/{f=1;next} /^```/{f=0} f' report/a11y-report.md > report/a11y-report.json
          fi
          cat report/a11y-report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload a11y-report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a11y-report
          path: webapp/report/a11y-report.*
          retention-days: 7
          if-no-files-found: ignore

      # Non-blocking link crawl over the export (scripts/crawl-export.mjs): internal targets
      # missing from out/ (a 404 on Pages), links landing on a redirect stub, links without
      # the trailing slash, anchors whose id is absent, external hosts. The script itself
      # exits non-zero only for missing targets; here that is a warning plus the artifact.
      - name: Link crawl report (non-blocking)
        continue-on-error: true
        run: |
          mkdir -p report
          node --test scripts/crawl-export.test.mjs
          node scripts/crawl-export.mjs out /court-vision > report/crawl-report.md \
            || echo "::warning::crawl-export found internal links with no target in the export (non-blocking; see the crawl-report artifact)"
          awk '/^```json/{f=1;next} /^```/{f=0} f' report/crawl-report.md > report/crawl-report.json
          cat report/crawl-report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload crawl-report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crawl-report
          path: webapp/report/crawl-report.*
          retention-days: 7
          if-no-files-found: ignore

      # Non-blocking browser QA on the shell pages (perf/keyboard-pages.json): the keyboard
      # walk (skip link, focus indicators, theme toggle, menu, palette, desk tabs) and the
      # third-party request inventory that backs the footer's "no analytics, no cookies,
      # no third-party requests" line. Same Chrome logic as the a11y report.
      - name: Browser QA reports -- keyboard walk + third-party requests (non-blocking; skipped when Chrome is absent)
        continue-on-error: true
        run: |
          mkdir -p report
          if [ -z "$A11Y_CHROME" ] && ! command -v google-chrome >/dev/null 2>&1; then
            echo "browser QA reports skipped: no Chrome found and A11Y_CHROME is unset" | tee report/keyboard-report.md report/third-party-report.md
          else
            node scripts/keyboard-walk.mjs out perf/keyboard-pages.json > report/keyboard-report.md \
              || echo "::warning::keyboard-walk reported FAIL rows (non-blocking; see the browser-qa-report artifact)"
            node scripts/third-party-requests.mjs out perf/keyboard-pages.json > report/third-party-report.md \
              || echo "::warning::a third-party host or a cookie was recorded; the footer line must change (non-blocking; see the browser-qa-report artifact)"
          fi
          cat report/keyboard-report.md report/third-party-report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload browser-qa-report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-qa-report
          path: |
            webapp/report/keyboard-report.md
            webapp/report/third-party-report.md
          retention-days: 7
          if-no-files-found: ignore

      # Re-enabled 2026-10-20 22:3xZ after re-measuring on the unified shell (qa run 39506767551:
      # every page inside budget.json + 10%; axe 0 serious/critical, 6 advisory moderate).
      - name: Performance budget -- gzip JS/CSS/HTML per page + image caps (hard gate)
        run: |
          node --test scripts/perf-budget.test.mjs scripts/a11y-gate.test.mjs
          node scripts/perf-budget.mjs out perf/budget.json

      - name: Accessibility gate -- axe-core, zero serious/critical in both themes (hard gate)
        # ubuntu-latest ships Google Chrome; playwright-core drives it (no browser download).
        run: node scripts/a11y-gate.mjs out perf/a11y-pages.json

      - name: Page-count tripwire (hard gate)
        run: |
          N=$(find out -name '*.html' | wc -l)
          echo "Exported HTML pages: $N"
          if [ "$N" -lt 1700 ]; then
            echo "::error::Page-count tripwire FAILED -- only $N pages (< 1700; the 2026-10-20 restructure retired the duplicate atlas family, ~1,800 expected). A template refactor may have dropped routes."
            exit 1
          fi
          echo "Page-count tripwire GREEN ($N >= 1700)."
